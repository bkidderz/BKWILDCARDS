# Publishes to the Comfy Registry — AUTOMATIC on every release.
#
# The repo is public and the REGISTRY_ACCESS_TOKEN secret is set, so publishing
# is now standard operation: every push to main that changes pyproject.toml
# (i.e. every version bump) republishes the node to the Registry. Manual runs
# are also available via Actions > "Publish to Comfy Registry" > Run workflow.
#
# RELEASE FLOW (unchanged): bump `version` in pyproject.toml + BUILD in the JS,
# commit, push. The push auto-publishes. The Registry REJECTS re-publishing an
# existing version, so the version MUST be bumped for each release — a commit
# that touches pyproject.toml WITHOUT bumping the version will fail this job
# (harmless, but noisy). One version bump = one publish.
#
# Setup (all complete):
#   [x] PublisherId set in pyproject.toml ([tool.comfy] PublisherId = bkidderz)
#   [x] License set (MIT, see LICENSE)
#   [x] REGISTRY_ACCESS_TOKEN secret set in repo Actions secrets
#   [x] Repository public

name: Publish to Comfy Registry

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
