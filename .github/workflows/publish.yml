# Publishes to the Comfy Registry when pyproject.toml changes on main.
#
# Setup status:
#   [x] Publisher ID set in pyproject.toml ([tool.comfy] PublisherId = bkidderz)
#   [x] License set (MIT, see LICENSE)
#   [ ] REGISTRY_ACCESS_TOKEN secret — generate an API key at
#       https://registry.comfy.org and save it in this repo under
#       Settings > Secrets and variables > Actions as REGISTRY_ACCESS_TOKEN
#
# Until that secret exists this workflow will fail. That is harmless if you are
# distributing via git clone / ZIP only — disable or delete the workflow.
#
# NOTE: it triggers on any push to main that touches pyproject.toml, so every
# version bump republishes. Bump the version deliberately.

name: Publish to Comfy Registry

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
