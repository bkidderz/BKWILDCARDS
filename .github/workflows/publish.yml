# Publishes to the Comfy Registry — MANUAL ONLY.
#
# Publishing to the Registry makes the node PUBLIC and installable. The repo is
# private during testing, so this MUST NOT run automatically. It is therefore
# gated to workflow_dispatch: it fires only when you click
#   Actions > "Publish to Comfy Registry" > Run workflow
# on GitHub. No push ever triggers it — that is intentional.
#
# Before the first manual run, when you ARE ready to go public:
#   [x] Publisher ID set in pyproject.toml ([tool.comfy] PublisherId = bkidderz)
#   [x] License set (MIT, see LICENSE)
#   [ ] REGISTRY_ACCESS_TOKEN secret — generate an API key at
#       https://registry.comfy.org and save it under
#       Settings > Secrets and variables > Actions as REGISTRY_ACCESS_TOKEN
#   [ ] Make the repository public
# Until the secret exists a manual run will fail; that is expected and harmless.

name: Publish to Comfy Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
