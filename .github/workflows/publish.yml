# Publishes to the Comfy Registry — AUTOMATIC on every release.
#
# Fires on every push to main that changes pyproject.toml (i.e. every version
# bump) and publishes the node WITH the per-version changelog read from NOTES.md,
# so the Registry "Updates" section is populated.
#
# We invoke comfy-cli directly instead of the thin Comfy-Org/publish-node-action
# because that action exposes no changelog input. The registry token stays the
# encrypted REGISTRY_ACCESS_TOKEN secret — passed via env, never printed, masked
# in logs. Keep NOTES.md at the repo root holding the CURRENT version's notes
# (replaced each release; it becomes that version's changelog).
# PLAIN TEXT ONLY in NOTES.md — the Comfy Registry does NOT render markdown in the
# Updates/version notes, so no #, *, **, _, etc. (they show as literal characters).

name: Publish to Comfy Registry

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install comfy-cli
        run: pip install comfy-cli
      - name: First-run setup (non-interactive)
        run: comfy --skip-prompt --no-enable-telemetry env
      - name: Publish with changelog
        run: comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_TOKEN" --changelog-file NOTES.md
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
